<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SPCC Tahama Cement Plant — Truck Loading Data</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#175CD3">
<style>
:root{--bg:#141a21;--card:#252e39;--in:#1b222b;--bd:#374151;--tx:#f1f5f9;--mu:#94a3b8;--ac:#0ea5e9;--g:#10b981;--r:#ef4444;--y:#f59e0b;--b:#3b82f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef2f7;--card:#fff;--in:#f1f5f9;--bd:#d5dce6;--tx:#0f172a;--mu:#64748b;color-scheme:light}
:root{color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:84px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:contain;flex:none}
.brand{line-height:1.15}.brand b{font-size:15px}.brand small{display:block;color:var(--ac);font-weight:700;font-size:10px;letter-spacing:.5px}
.sp{flex:1}.chip{padding:3px 9px;border-radius:99px;border:1px solid var(--bd);font-size:11px;font-weight:700;background:var(--in)}
.ib{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--bd);background:var(--in)}
.pri{background:#7ab4ff;color:#0b1220;font-weight:700;border:0}
main{max-width:620px;margin:14px auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 2px;letter-spacing:.3px}.sub{color:var(--mu);font-size:11px}
label{display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin:14px 0 6px;color:var(--tx)}label i{color:var(--ac);font-style:normal;font-weight:500;font-size:11px}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--in);outline:0}.in:focus{border-color:var(--ac)}
.row{display:flex;gap:8px}.row>*{flex:1}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bt{padding:9px 4px;border-radius:12px;border:1px solid var(--bd);background:var(--in);text-align:center;font-weight:700;font-size:12px}
.bt small{display:block;font-size:10px;color:var(--mu)}.bt.ok small{color:var(--g)}
.bt.sel{border:2px solid var(--ac);background:#0b3a5e;color:#fff}.bt.blk{background:#3a1a1e;border-color:#7f1d1d;color:#fca5a5}.bt.blk small{color:var(--r)}
.go{background:linear-gradient(90deg,#0284c7,#06b6d4);border:0;color:#fff;font-weight:800;border-radius:14px;padding:12px 16px}
.gh{border:1px solid var(--bd);background:transparent;border-radius:14px;padding:12px 14px;font-weight:700}
.stp{border:2px dashed #8a6a1c;border-radius:16px;padding:8px}.warn{color:var(--y);font-size:11px;margin-top:6px}
.stat{padding:11px 13px;border-radius:12px;font-weight:800;display:flex;justify-content:space-between;border:1px solid var(--g);background:#0f3a2c;color:var(--g)}
.stat.o{border-color:var(--y);background:#3b2d0c;color:var(--y)}.stat.l{border-color:var(--ac);background:#0b3a5e;color:var(--ac)}
.dur{display:flex;justify-content:space-between;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin-top:10px;font-family:monospace}
.bay{padding:10px;border-radius:16px;background:var(--in);border:1px solid var(--bd);min-height:86px;font-size:11px;color:var(--mu)}
.bay b{color:var(--tx);font-size:13px}.bay .s{display:block;font-weight:800;margin:6px 0 2px}.bay.blk{background:#3a1a1e;border-color:#7f1d1d}
.pk{padding:7px 3px;border-radius:10px;background:var(--in);border:1px solid var(--bd);text-align:center;font-size:10px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:13px;border-radius:14px;background:var(--in);border:1px solid var(--bd);margin-bottom:8px;font-weight:700}
.kv span:last-child{font:800 20px monospace}.H{font-size:11px;font-weight:800;color:var(--mu);margin:14px 0 8px;letter-spacing:.4px}
.o1{color:var(--b)}.o2{color:var(--g)}.o3{color:var(--y)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chips button{white-space:nowrap;padding:7px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--in)}.chips .on{background:#0284c7;border-color:#0284c7;color:#fff;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;border-bottom:1px solid var(--bd);padding-top:10px}.bars div{flex:1;background:#7ab4ff;border-radius:8px 8px 0 0;min-height:2px;position:relative}
.bars div em{position:absolute;top:-16px;width:100%;text-align:center;font-size:10px;font-style:normal;color:var(--mu)}
.xl{display:flex;gap:8px;color:var(--mu);font-size:11px;text-align:center;margin-top:4px}.xl span{flex:1}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:var(--mu);font-size:10px;text-align:start;padding:8px 4px}td{padding:9px 4px;border-top:1px solid var(--bd)}
.pb{height:6px;background:var(--in);border-radius:9px;overflow:hidden;min-width:44px}.pb i{display:block;height:100%;background:var(--ac)}
.k4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k4 div{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:11px}.k4 small{color:var(--mu);font-size:10px;font-weight:700}.k4 b{display:block;font:800 20px monospace}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;max-width:120px;background:none;border:0;color:var(--mu);font-size:11px;font-weight:700;position:relative;padding:6px 0}nav button.on{color:#7ab4ff}nav button span{display:block;font-size:18px}
nav sup{position:absolute;top:0;inset-inline-end:14px;background:var(--in);border:1px solid var(--bd);border-radius:9px;padding:0 5px;font-size:9px;color:var(--tx)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;width:min(92vw,380px)}dialog::backdrop{background:#0009}
.donut{display:block;margin:6px auto}
[dir=rtl] body{font-family:Tahoma,system-ui,sans-serif}
</style></head><body>

if(keep&&$(keep)&&$(keep).tagName=='INPUT'){$(keep).focus()}}
function clock(){const h=hr();$('clk').textContent='🕒 '+f12(nowT())+' KSA | Asia/Riyadh';$('shb').textContent=shiftOf(h)+' '+T('shift');const d=$('du');if(d&&F.s&&!F.e)d.textContent=hms(durS(F.s,nowT()))}
function save(done){if(!S.user)return toast(T('need'));if(!F.qr||!F.L||!F.P||!F.stop)return toast(T('req'));if(done&&!F.e)return toast(T('endr'));if(busy(F.L)||S.recs.find(r=>r.qr==F.qr&&!r.e))return toast(T('dup'));
const s=F.s||nowT();S.recs.unshift({id:Date.now(),t:Date.now(),qr:F.qr,sh:shiftOf(hr()),op:S.user.name,L:F.L,P:F.P,ct:ctOf(F),...qf(F),s,e:done?F.e:'',stop:F.stop});F={qr:'',L:null,P:null,s:'',e:'',stop:''};sv();push(S.recs[0]);toast(T('saved'));render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-l],[data-p],[data-s],[data-n],[data-f],[data-pg],[data-b],[data-pb],button,i.a');if(!t)return;const d=t.dataset;
if(d.pg){pg=d.pg;return render()}if(d.f){fl=d.f;return render()}
if(d.l){if(!S.blk.L[d.l])F.L=+d.l;return render()}if(d.p){if(!S.blk.P[d.p])F.P=+d.p;return render()}if(d.s){F.stop=d.s;return render()}
if(d.n){F[d.n]=nowT();return render()}
if(d.b){const i=d.b,y=busy(i),adm=S.user&&S.user.role=='admin';if(S.blk.L[i]){if(adm){delete S.blk.L[i];sv();pushB()}}else if(y){y.e=nowT();sv();push(y)}else if(adm&&e.target.closest('.bay').offsetWidth&&e.detail>0&&confirm('Block L-'+i+'?')){const r=prompt(T('rsn'),'Mechanical under maintenance');if(r){S.blk.L[i]={r,by:S.user.name};sv();pushB()}}else F.L=+i;return render()}
if(d.pb){const i=d.pb;if(S.blk.P[i]){if(S.user&&S.user.role=='admin')delete S.blk.P[i]}else if(S.user&&S.user.role=='admin'&&confirm('Block P-'+i+'?')){const r=prompt(T('rsn'),'Auto-Loader');if(r)S.blk.P[i]={r,by:S.user.name}}else F.P=+i;sv();pushB();return render()}
const id=t.id,ar=S.lang=='ar';if(id=='em'){if(!U())return toast(ar?'الربط غير مفعّل':'Sheet link not set');fetch(U(),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'email'})}).catch(()=>{});return toast(ar?'تم إرسال ملف Excel للإيميل':'Excel sent to email')}
if(id=='gs'){if(S.sheetUrl)window.open(S.sheetUrl,'_blank');else toast(ar?'الرابط غير جاهز، حدّث الصفحة':'Link not ready, refresh');return}
if(id=='fc'){F={qr:'',L:null,P:null,s:'',e:'',stop:''};render()}if(id=='fg'){if(!F.s)F.s=nowT();F.e='';save(false)}if(id=='fd')save(true);
if(id=='fs')scanQR();
if(id=='bS'){if(S.user){S.user=null;sv();render()}else{$('dg').showModal()}}if(id=='bL'){S.lang=S.lang=='ar'?'en':'ar';sv();render()}if(id=='bT'){S.theme=S.theme=='dark'?'light':'dark';sv();render()}if(id=='bR'){pull(1)}
if(id=='ex'){const a=filt(),c='Receipt,Shift,Operator,Loader,Packer,Cement,Start,End,Stoppage,Bags,Tons\n'+a.map(r=>[r.qr,r.sh,r.op,'L-'+r.L,'P-'+r.P,r.ct,f12(r.s),f12(r.e),r.stop,bags(r),tons(r)].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));l.download='truck-loading.csv';l.click()}});
let role='operator';const rr=()=>{$('rO').className='bt '+(role=='operator'?'sel':'');$('rA').className='bt '+(role=='admin'?'sel':'')};
$('rO').onclick=()=>{role='operator';rr()};$('rA').onclick=()=>{role='admin';rr()};$('dc').onclick=()=>$('dg').close();
$('dk').onclick=()=>{const n=$('nm').value.trim();if(!n)return;S.user={name:n,role};sv();$('dg').close();render()};

document.addEventListener('input',e=>{const i=e.target.id;if(i=='fq')F.qr=e.target.value;if(i=='fa'){F.s=e.target.value}if(i=='fe'){F.e=e.target.value;$('du').textContent=hms(durS(F.s,F.e))}if(i=='fz'){q=e.target.value;const c=e.target.selectionStart;render();$('fz').focus();$('fz').setSelectionRange(c,c)}if(i=='cu'){S.cfg.url=e.target.value.trim();sv();pull()}if(i=='cb'||i=='ck'){S.cfg.bags=+$('cb').value||600;S.cfg.kg=+$('ck').value||50;sv()}});
document.addEventListener('change',e=>{if(e.target.id=='fq'&&F.qr&&!F.s){F.q=parseQR(F.qr);F.s=nowT();render()}});
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('bI').hidden=false});$('bI').onclick=()=>dp&&dp.prompt();
function ld_(u){return new Promise(r=>{const e=document.createElement('script');e.src=u;e.onload=e.onerror=r;document.head.appendChild(e)})}
async function scanQR(){
const ar=S.lang=='ar',ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px';
ov.innerHTML='<video playsinline muted style="width:100%;max-width:520px;max-height:60vh;object-fit:cover;border-radius:18px;border:2px solid #0ea5e9"></video><div id="sm" style="color:#fff;font-weight:700;text-align:center">'+(ar?'جاري تجهيز الماسح...':'Preparing scanner...')+'</div><div class="row" style="max-width:520px;width:100%"><label class="gh" style="color:#fff;text-align:center;margin:0;display:block;cursor:pointer">📷 '+(ar?'التقط صورة':'Take photo')+'<input type="file" accept="image/*" capture="environment" hidden></label><button class="gh" style="color:#fff">'+T('cancel')+'</button></div>';
document.body.appendChild(ov);const v=ov.querySelector('video'),sm=ov.querySelector('#sm'),fi=ov.querySelector('input');let st,on=true,det=null,rd=null;
const end=()=>{on=false;st&&st.getTracks().forEach(t=>t.stop());ov.remove()};ov.querySelector('button').onclick=end;
const done=val=>{end();F.qr=String(val).trim();F.q=parseQR(F.qr);F.s=nowT();render();navigator.vibrate&&navigator.vibrate(60)};
if('BarcodeDetector' in window)try{det=new BarcodeDetector()}catch(e){}
if(!det){await ld_('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');if(!window.ZXing)await ld_('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js');
if(window.ZXing){rd=new ZXing.MultiFormatReader();rd.setHints(new Map([[ZXing.DecodeHintType.TRY_HARDER,true]]))}}
const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
async function dec(el,w0,h0){const k=Math.min(1,1400/Math.max(w0,h0)),w=Math.round(w0*k),h=Math.round(h0*k);c.width=w;c.height=h;x.drawImage(el,0,0,w,h);
if(det){try{const r=await det.detect(c);if(r[0])return r[0].rawValue}catch(e){}}
const d=x.getImageData(0,0,w,h);
if(rd){try{const l=new Uint8ClampedArray(w*h);for(let i=0,j=0;i<l.length;i++,j+=4)l[i]=(d.data[j]*77+d.data[j+1]*150+d.data[j+2]*29)>>8;return rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(l,w,h)))).getText()}catch(e){}}
if(window.jsQR){const r=jsQR(d.data,w,h);if(r)return r.data}return ''}
fi.onchange=async()=>{const f=fi.files[0];if(!f)return;sm.textContent='...';const im=new Image();im.onload=async()=>{const val=await dec(im,im.naturalWidth,im.naturalHeight);if(val)done(val);else sm.textContent=ar?'ما قدرت أقرأ الصورة، قرّب وجرّب مرة ثانية':'Could not read the photo, move closer and retry'};im.src=URL.createObjectURL(f)};
try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=st;await v.play()}catch(e){sm.textContent=(ar?'الكاميرا غير متاحة (يلزم https وإذن الكاميرا). استخدم التقاط صورة أو اكتب الرقم.':'Camera unavailable (needs https + permission). Use Take photo or type the number.');return}
sm.textContent=ar?'وجّه الكاميرا على الباركود وثبّتها':'Point the camera at the barcode and hold steady';const t0=Date.now();
const loop=async()=>{if(!on)return;if(v.videoWidth){const val=await dec(v,v.videoWidth,v.videoHeight);if(val)return done(val)}
if(Date.now()-t0>8000)sm.textContent=ar?'قرّب أو ابعد قليلاً وتأكد من الإضاءة، أو استخدم التقاط صورة':'Move closer/farther, check lighting, or use Take photo';setTimeout(loop,150)};loop()}
const U=()=>S.cfg.url||SHEET_URL;
function push(r){if(!U())return;fetch(U(),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'save',rec:Object.assign({},r,{bags:bags(r),tons:tons(r),s12:f12(r.s),e12:f12(r.e)})})}).catch(()=>{})}
function pushB(){if(!U())return;fetch(U(),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'blocks',blk:S.blk})}).catch(()=>{})}
async function pull(f){if(!U())return;try{const d=await (await fetch(U())).json(),n=JSON.stringify([d.recs,d.blk]);if(!f&&n==JSON.stringify([S.recs,S.blk]))return;if(d.url)S.sheetUrl=d.url;if(d.recs)S.recs=d.recs;if(d.blk)S.blk=d.blk;sv();if(f||!(document.activeElement&&document.activeElement.tagName=='INPUT'))render()}catch(e){}}
render();clock();setInterval(clock,1000);pull();setInterval(pull,20000);
